# Baut NetMonitor für Windows, Linux und macOS.
#   - Manuell (Actions → Release → Run workflow): Pakete als Artefakte zum Herunterladen
#   - Tag "v*" pushen (z. B. v1.3.0): zusätzlich GitHub-Release mit allen Paketen
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Windows package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build\Build-Release.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/*.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build linux-x64
        run: bash cross/build/build-linux.sh linux-x64
      - name: Build linux-arm64
        run: bash cross/build/build-linux.sh linux-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: dist/*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Apple Silicon
        run: bash cross/build/build-macos.sh osx-arm64
      - name: Build Intel
        run: bash cross/build/build-macos.sh osx-x64
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "NetMonitor ${GITHUB_REF_NAME#v}" --generate-notes
          fi
